name: Refresh proof

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-proof
  cancel-in-progress: false

jobs:
  measure:
    runs-on: instabox-medium
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Refresh deterministic package rows
        run: node scripts/proof.mjs --deterministic
      - name: Refresh and verify the saved website mock
        env:
          VERCEL_GIT_COMMIT_SHA: '0000000000000000000000000000000000000000'
        run: |
          node website/build.mjs
          cp website/dist/index.html website/mock/index.html
          node website/check.mjs
      - name: Verify proof fields and expiry
        run: node --test test/proof.test.mjs test/proof-expiry.test.mjs
      - name: Propose one proof refresh pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-proof-branch.mjs
