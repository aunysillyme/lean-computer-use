name: Refresh proof

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-proof
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Refresh deterministic package rows
        run: node scripts/proof.mjs --deterministic
      - name: Verify proof fields and expiry
        run: node --test test/proof.test.mjs test/proof-expiry.test.mjs
      - name: Propose one proof refresh pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const base = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = {
            authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            accept: 'application/vnd.github+json',
            'x-github-api-version': '2022-11-28',
            'content-type': 'application/json',
          };
          async function api(endpoint, method = 'GET', body) {
            const response = await fetch(`${base}${endpoint}`, {
              method, headers, body: body === undefined ? undefined : JSON.stringify(body),
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw Error(`GitHub ${method} ${endpoint}: ${response.status} ${await response.text()}`);
            return response.status === 204 ? null : response.json();
          }
          const repository = await api('');
          const branch = 'automation/refresh-proof';
          const files = ['proof/results.json', 'README.md'];
          const changed = [];
          for (const file of files) {
            const remote = await api(`/contents/${file}?ref=${encodeURIComponent(repository.default_branch)}`);
            const content = await fs.readFile(file, 'utf8');
            if (Buffer.from(remote.content, 'base64').toString('utf8') !== content) changed.push({ file, content });
          }
          if (!changed.length) process.exit(0);
          const refs = await api(`/git/matching-refs/heads/${branch}`);
          if (!refs.some(ref => ref.ref === `refs/heads/${branch}`)) {
            const head = await api(`/git/ref/heads/${encodeURIComponent(repository.default_branch)}`);
            await api('/git/refs', 'POST', { ref: `refs/heads/${branch}`, sha: head.object.sha });
          }
          for (const { file, content } of changed) {
            const current = await api(`/contents/${file}?ref=${encodeURIComponent(branch)}`);
            if (Buffer.from(current.content, 'base64').toString('utf8') !== content) {
              await api(`/contents/${file}`, 'PUT', {
                message: 'Refresh deterministic package proof', branch, sha: current.sha,
                content: Buffer.from(content).toString('base64'),
              });
            }
          }
          const owner = process.env.GITHUB_REPOSITORY.split('/')[0];
          const prs = await api(`/pulls?state=open&head=${encodeURIComponent(`${owner}:${branch}`)}`);
          if (!prs.length) await api('/pulls', 'POST', {
            title: 'Refresh deterministic package proof', head: branch, base: repository.default_branch,
            body: 'Refresh deterministic package receipts and the README proof table. Test receipts retain their original dates until those suites run again.\n\nThe Actions token does not trigger CI for this pull request. The maintainer reviews and runs required checks before merging.',
          });
          NODE
