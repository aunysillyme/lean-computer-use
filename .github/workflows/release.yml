name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # Maintainer verifies and replaces this major tag with a full SHA before release automation.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Require tag equals version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version"
      - run: node --test
      - run: node scripts/build.mjs --check
      - run: node scripts/self-check.mjs
      - name: Test desk tools and native hooks
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q desk/tests hooks/tests
      - name: Check JavaScript types
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
      - name: Check public text
        run: node scripts/check-terms.mjs
      - name: Pack once and smoke-install that tarball
        run: |
          set -eu
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          tarball="$release/$(npm pack --silent --pack-destination "$release")"
          trial="$(mktemp -d)"
          trap 'rm -rf "$trial"' EXIT
          cd "$trial"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$tarball"
          command_path="$trial/node_modules/.bin/lean-computer-use"
          "$command_path" --help
          "$command_path" install --dir "$trial/host" --share "$trial/share" --dry-run --yes
          "$command_path" install --dir "$trial/host" --share "$trial/share" --yes
          "$command_path" uninstall --dir "$trial/host" --share "$trial/share"
          node --input-type=module - "$trial/host" "$trial/share" <<'NODE'
          import fs from 'node:fs';
          for (const dir of process.argv.slice(2)) {
            if (fs.existsSync(dir) && fs.readdirSync(dir).length) throw Error('Uninstall left owned content.');
          }
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the verified tarball
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Select the publishing CLI
        run: npm install -g npm@12.2.0 --ignore-scripts
      - name: Publish the verified tarball
        run: |
          set -eu
          set -- ./release/*.tgz
          test "$#" -eq 1
          meta="$(tar -xzOf "$1" package/package.json)"
          name="$(printf '%s' "$meta" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
          version="$(printf '%s' "$meta" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          if npm view "$name@$version" version --prefer-online > /dev/null 2>&1; then
            echo "$name@$version is already on the registry; nothing to publish."
            exit 0
          fi
          npm publish "$1" --provenance --access public

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release page unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to create."
            exit 0
          fi
          name="$(node -p "require('./package.json').name")"
          version="${TAG#v}"
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "$notes"
          test -s "$notes" || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$TAG" --verify-tag --title "$name $version" --notes-file "$notes"
